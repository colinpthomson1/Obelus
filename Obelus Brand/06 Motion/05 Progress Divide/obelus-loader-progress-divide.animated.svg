<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="ob-title ob-desc" data-complete="false">
  <title id="ob-title">Progress Divide</title>
  <desc id="ob-desc">Accessible decorative preview of the Progress Divide loading animation. Pair with a textual status in production.</desc>
  <style>
    :root { color: #3B50E0; }
    .ob-base { opacity: .24; }
    .ob-art { fill: currentColor; }
    @media (forced-colors: active) {
      :root { color: CanvasText; }
      .ob-base { opacity: 1; }
      .ob-animated { display: none; }
    }
  </style>

  <style>
    :root { --ob-progress:.62; }
    .ob-progress-bar { transform-box:fill-box; transform-origin:left center; transform:scaleX(var(--ob-progress)); transition:transform 160ms linear; }
    .ob-progress-bottom { opacity:0; transform-box:fill-box; transform-origin:center; transform:scale(.78); transition:opacity 220ms cubic-bezier(.25,1,.5,1),transform 220ms cubic-bezier(.25,1,.5,1); }
    [data-complete="true"] .ob-progress-bottom { opacity:1; transform:scale(1); }
    @media (prefers-reduced-motion: reduce) { .ob-progress-bar,.ob-progress-bottom { transition:none } }
  </style>
  <g class="ob-art ob-base">    <circle class="top " cx="26" cy="14" r="5.6"/>
    <path class="bar " d="M17 27H45C47.4 27 49.2 28.2 51.4 30.4C52.3 31.3 52.3 32.7 51.4 33.6C49.2 35.8 47.4 37 45 37H17C14.2 37 12 34.8 12 32C12 29.2 14.2 27 17 27Z"/>
    <circle class="bottom " cx="38" cy="50" r="5.6"/></g>
  <g class="ob-art ob-animated">
    <circle cx="26" cy="14" r="5.6"/>
    <path class="ob-progress-bar" d="M17 27H45C47.4 27 49.2 28.2 51.4 30.4C52.3 31.3 52.3 32.7 51.4 33.6C49.2 35.8 47.4 37 45 37H17C14.2 37 12 34.8 12 32C12 29.2 14.2 27 17 27Z"/>
    <circle class="ob-progress-bottom" cx="38" cy="50" r="5.6"/>
  </g>
</svg>
